name: caddy
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 1,15 * *'
jobs:
  build:
    strategy:
      matrix:
        plugin: [azure,cloudflare,alidns,tencentcloud,googleclouddns,huaweicloud,duckdns,acmedns]
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Setup timezone
        uses: zcong1993/setup-timezone@master
        with:
          timezone: Asia/Shanghai

      # 定时触发时检查上游是否有更新,未更新则跳过构建推送;本地文件改动需手动触发才会构建
      - name: Check upstream
        id: check
        continue-on-error: true
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          hub_time() { curl -sf --max-time 30 "https://hub.docker.com/v2/repositories/$1/tags/$2" | jq -r '.tag_last_pushed // ""'; }
          builder_time=$(hub_time library/caddy builder) || builder_time=""
          runtime_time=$(hub_time library/caddy latest) || runtime_time=""
          plugin_time=$(curl -sf --max-time 30 -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/caddy-dns/${{ matrix.plugin }}/commits" | jq -r '.[0].commit.committer.date // ""') || plugin_time=""
          ours_time=$(hub_time "${{ secrets.DOCKER_HUB_USERNAME }}/caddy-dns" "${{ matrix.plugin }}") || ours_time=""
          ./.github/scripts/check-upstream.sh "$ours_time" "$builder_time" "$runtime_time" "$plugin_time"

      - name: ready
        if: steps.check.outputs.skip != 'true'
        run: |
          cp ./caddy/Dockerfile ./Dockerfile
          sed -i "s/\${plugin}/${{ matrix.plugin }}/" ./Dockerfile

      # docker login
      - name: Login to Docker Hub
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 设置 docker buildx 环境
      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        id: buildx
        uses: docker/setup-buildx-action@v2

      # build 前置操作
      - name: Docker before
        if: steps.check.outputs.skip != 'true'
        id: docker_before
        run: |
          image="${{ secrets.DOCKER_HUB_USERNAME }}/caddy-dns"
          tags="$image:${{matrix.plugin}}_$(date +'%y-%m-%d_%H-%M'),$image:${{matrix.plugin}}"
          echo "target images $tags"
          echo "tags=$tags" >> $GITHUB_OUTPUT
          # 一个特殊镜像,修复某些buildx 的 bug
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes > /dev/null 2>&1

      # build 并且 push docker 镜像
      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{steps.docker_before.outputs.tags}}
          platforms: linux/amd64,linux/arm64/v8

      # 打印 docker 镜像 SHA256 Hash 值
      - name: Image digest
        if: steps.check.outputs.skip != 'true'
        run: echo ${{ steps.docker_build.outputs.digest }}
