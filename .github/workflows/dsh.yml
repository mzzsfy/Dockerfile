name: dsh
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 */2 * *'
jobs:
  # 上游检查与 tag 计算集中执行,保证各平台构建使用同一组 tag
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Check Out
        uses: actions/checkout@v7

      # 定时触发时检查上游是否有更新,未更新则跳过构建推送;本地文件改动需手动触发才会构建
      - name: Check upstream
        id: check
        continue-on-error: true
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          hub_time() { curl -sf --max-time 30 "https://hub.docker.com/v2/repositories/$1/tags/$2" | jq -r '.tag_last_pushed // ""'; }
          npm_time() { curl -sf --max-time 30 "https://registry.npmjs.org/$1" | jq -r '."dist-tags".latest as $v | .time[$v] // ""'; }
          dsh_time=$(npm_time "@deepseek-ai%2Fdsh") || dsh_time=""
          pnpm_time=$(npm_time "pnpm") || pnpm_time=""
          node_time=$(hub_time library/node 24-bookworm-slim) || node_time=""
          ours_time=$(hub_time "${{ secrets.DOCKER_HUB_USERNAME }}/dsh" latest) || ours_time=""
          ./.github/scripts/check-upstream.sh "$ours_time" "$dsh_time" "$pnpm_time" "$node_time"

      # 时区只影响 tag 名的时间戳
      - name: Image tags
        id: tags
        run: |
          export TZ=Asia/Shanghai
          image="${{ secrets.DOCKER_HUB_USERNAME }}/dsh"
          tags="$image:$(date +'%y-%m-%d_%H-%M'),$image:latest"
          echo "target images $tags"
          echo "tags=$tags" >> $GITHUB_OUTPUT

  # 镜像行为验收,通过后才推送
  verify:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: ./dsh
          load: true
          tags: dsh-persistence-test
          platforms: linux/amd64

      - name: Verify environment persistence
        timeout-minutes: 40
        run: sh dsh/tests/ci.sh dsh-persistence-test full

  # 各平台在对应架构的原生 runner 上构建,避免 qemu 用户态模拟下 node 随机段错误
  build:
    needs: [prepare, verify]
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 只推 digest,不落 tag,合并阶段才产生对外 tag
      - name: Build by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./dsh
          file: ./dsh/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKER_HUB_USERNAME }}/dsh,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 合并各平台 digest 为多架构 manifest
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="${{ secrets.DOCKER_HUB_USERNAME }}/dsh"
          docker buildx imagetools create \
            $(echo "${{ needs.prepare.outputs.tags }}" | tr ',' '\n' | sed 's/^/-t /') \
            $(printf "$image@sha256:%s " *)

      # 打印 docker 镜像 SHA256 Hash 值
      - name: Image digest
        run: docker buildx imagetools inspect ${{ secrets.DOCKER_HUB_USERNAME }}/dsh:latest
